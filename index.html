<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная страница</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Vinyl&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
  <script src="files/script.JS" defer></script>
</head>
<body>
  <main>
    <section class="page hero" id="page1" aria-labelledby="welcome">
      <canvas id="waveCanvas" aria-hidden="true"></canvas>
      <h1 class="welcome-text" id="welcome">WELCOME</h1>
      <nav class="navigation" aria-label="Основная навигация">
        <a href="#link2">Обо мне</a>
        <a href="#link">Мои проекты</a>
      </nav>
      <img src="image/первый кадр.png" alt="Авторская иллюстрация" class="top-image">
    </section>

    <section class="page projects" id="page2" aria-labelledby="link">
      <canvas id="waveCanvasMirror" aria-hidden="true"></canvas>
      <div class="panel projects-panel">
        <h2 id="link">Мои проекты</h2>
      </div>
    </section>

    <section class="page about" id="page3" aria-label="Обо мне">
      <span class="section-anchor" id="link2"></span>
      <img src="image/icon3.png" alt="" class="about-image" loading="lazy">
      <div class="panel about-panel">
        <div class="cards">
          <button class="flip-container" type="button" aria-label="О Ксении: перевернуть карточку" aria-pressed="false">
            <span class="flipper">
              <span class="front"><img src="image/cat2.jpg" alt="Кот" loading="lazy"></span>
              <span class="back">Приветствую! Меня зовут Ксения, мне 22 года, и я занимаюсь вёрсткой сайтов. Сейчас вы находитесь
                в моей личной визитной карточке, которую я разрабатывала сама.
                Я также работаю преподавателем, и учу ребят как делать такие же сайтики шутка :3</span>
            </span>
          </button>
          <button class="flip-container" id="flip2" type="button" aria-label="Мои увлечения: перевернуть карточку" aria-pressed="false">
            <span class="flipper">
              <span class="front"><img src="image/cat1.jpg" alt="Кот" loading="lazy"></span>
              <span class="back">Расскажу немножечко о себе. Я очень люблю аниме и видеоигры, и именно они и натолкнули меня на то, чтобы стать тем,
                кем я являюсь сейчас. Мне нравится заниматься не только разработкой сайтов, но и также программировать на питоне.
                Ещё я очень люблю рисовать, и в целом увлекаюсь дизайном. Именно я разработала дизайн этого сайта, а также отрисовала некоторые его элементы</span>
            </span>
          </button>
        </div>
        <div class="icons" role="group" aria-label="Социальные сети">
          <img src="image/ВК.png" alt="ВКонтакте" loading="lazy" width="100" height="100">
          <img src="image/ТГ.png" alt="Telegram" loading="lazy" width="100" height="100">
          <img src="image/ТТ.png" alt="TikTok" loading="lazy" width="100" height="100">
          <img src="image/ТВИЧ.png" alt="Twitch" loading="lazy" width="100" height="100">
          <img src="image/ДС.png" alt="Discord" loading="lazy" width="100" height="100">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
