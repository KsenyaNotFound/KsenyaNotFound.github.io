<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Написать мне</title>
  <link rel="stylesheet" href="../styles/contact.css?v=a5b8136162c7">
  <script src="contact.js?v=eded8744ba10" defer></script>
</head>
<body>
  <main>
    <h1>Написать мне</h1>
    <a href="mailto:kellisparkl@yandex.ru">Написать по электронной почте</a>
    <p>Форма откроет почтовое приложение с подготовленным сообщением.</p>
    <form class="contact-form">
      <p><label for="username">Ваше имя:</label>
        <input id="username" type="text" name="username" autocomplete="name" required></p>
      <p><label for="useremail">Ваш email:</label>
        <input id="useremail" type="email" name="useremail" autocomplete="email" required></p>
      <p><label for="message">Сообщение:</label>
        <textarea id="message" name="message" required></textarea></p>
      <button type="submit">Отправить</button>
    </form>
    <p><button id="openForm" type="button">Открыть форму в окне</button></p>
    <dialog id="popup" aria-labelledby="popup-title">
      <h2 id="popup-title">Написать мне</h2>
      <form class="contact-form" id="mailForm">
        <p><label for="popup-name">Ваше имя:</label>
          <input id="popup-name" type="text" name="username" autocomplete="name" required></p>
        <p><label for="popup-email">Ваш email:</label>
          <input id="popup-email" type="email" name="useremail" autocomplete="email" required></p>
        <p><label for="popup-message">Сообщение:</label>
          <textarea id="popup-message" name="message" required></textarea></p>
        <button type="submit">Отправить</button>
      </form>
      <form method="dialog"><button type="submit">Закрыть</button></form>
    </dialog>
  </main>
</body>
</html>
